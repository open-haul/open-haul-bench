name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: tests (free, offline)
        run: npm test
      - name: release gate (scripted cheat agents and the solver, 12 h and 24 h)
        run: npm run gate
